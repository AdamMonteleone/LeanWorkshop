name = "LeanWorkshop"
version = "0.1.0"
defaultTargets = ["Week1", "Week1Solutions"]
packagesDir = ".lake/packages"

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "Week1"

[[lean_lib]]
name = "Week1Solutions"
